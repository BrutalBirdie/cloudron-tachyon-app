name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version=$(jq -r .version CloudronManifest.json)
          if [[ "${version}" != "${manifest_version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match CloudronManifest version ${manifest_version}"
              exit 1
          fi

      - name: Extract changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v entry="[${version}]" '$0 == entry { found=1; next } /^\[/ { found=0 } found' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
              echo "no CHANGELOG.md entry for ${version}"
              exit 1
          fi
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
